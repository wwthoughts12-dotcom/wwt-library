'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlVHOEmWsc7BjxeB1w0dcqsTuPCstHe7lrA5fIPUNMFaoLmPSjqyzO3LPkoUpxQNY8ShrWCXBXyf_X/pub?output=csv';

const ARTS_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vSho-xQsv1AtpTa-k_wDgcO968CYzd546FRuxVXAsWHDt1Y8Ey6yYOL_kEJ5cKiNC7VcYeMtfSYboQE/pub?output=csv';

let books = [];
let newBooks = [];
let announcements = [];
let arts = [];

let currentSeries = 'Все';

const favorites =
JSON.parse(
    localStorage.getItem('favorites') || '[]'
);
  async function loadCSV(url, name){

    try{

        const response = await fetch(
            url + '&_=' + Date.now(),
            {
                cache:'no-store'
            }
        );

        if(!response.ok){

            throw new Error(
                name + ': HTTP ' +
                response.status
            );

        }

        const text =
            await response.text();

        if(!text.trim()){

            throw new Error(
                name + ': пустой ответ'
            );

        }

        const result =
            Papa.parse(
                text,
                {
                    header:true,
                    skipEmptyLines:true
                }
            );

        if(result.errors?.length){

            console.warn(
                name,
                result.errors
            );

        }

        return result.data || [];

    }catch(error){

        console.error(

.toLowerCase();

filtered.filter(
b=>
b.series ===
currentSeries
);

if(search){

filtered =
filtered.filter(book=>{

return (

(book.title || '')
.toLowerCase()
.includes(search)

||

(book.author || '')
.toLowerCase()
.includes(search)

||

(book.series || '')
.toLowerCase()
.includes(search)

);

});

createBookCard(book);

const index =
favorites.indexOf(
String(id)
);

favorites.splice(

);

String(id)
);

'favorites',

favorites
)
);

}

}
    function openPlaylist(id){

    const book =
        books.find(
            b =>
                String(b.ID) ===
                String(id)
        );

    if(!book || !book.spotify_playlist){
        return;
    }

    let spotifyUrl =
        book.spotify_playlist.trim();

    /*
       Если ссылка:
       https://open.spotify.com/playlist/XXXXX

       преобразуем в:
       https://open.spotify.com/embed/playlist/XXXXX
    */

    if(
        spotifyUrl.includes(
            'open.spotify.com/'
        )
    ){

        spotifyUrl =
            spotifyUrl.replace(
                'open.spotify.com/',
                'open.spotify.com/embed/'
            );

    }

    document.getElementById(
        'playlistContent'
    ).innerHTML = `

        <img
            src="${book.cover_url}"
            class="playlist-modal-cover"

            onerror="
                this.style.display='none'
            "
        >

        <h2 class="playlist-modal-title">
            ${book.title || ''}
        </h2>

        <div class="playlist-modal-author">
            ${book.author || ''}
        </div>

        <iframe
            class="spotify-player"
            src="${spotifyUrl}"
            allow="
                autoplay;
                clipboard-write;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "
            loading="lazy"
        ></iframe>

        <button
            class="btn close-modal"
            onclick="closePlaylist()"
        >
            Закрыть
        </button>

    `;

    document
        .getElementById(
            'playlistModal'
        )
        .classList.add(
            'show'
        );

}
    
function closePlaylist(){

    document
        .getElementById(
            'playlistModal'
        )
        .classList.remove(
            'show'
        );

}
    document
    .getElementById(
        'playlistModal'
    )

        'click',
        function(e){

            if(
                e.target.id ===
                'playlistModal'

                closePlaylist();

            }

        }
    );


function renderArts(){

    const container =
        document.getElementById(
            'artsContainer'
        );

    if(!container){
        return;
    }

    container.innerHTML = '';

    if(!arts.length){

        container.innerHTML = `
            <div class="card">
                Пока нет артов.
            </div>
        `;

        return;
    }


    arts.forEach(item => {

        const images =
            (item.arts || '')
                .split('|')
                .map(url => url.trim())
                .filter(Boolean);


        if(!images.length){
            return;
        }


        let gallery = '';


        images.forEach((image, index) => {

            gallery += `

                <img
                    src="${image}"
                    alt="${
                        item.title ||
                        'Арт ' + (index + 1)
                    }"
                    loading="lazy"

                    onclick="
                        openFullscreen(
                            '${image.replace(
                                /'/g,
                                "\\'"
                            )}'
                        )
                    "

                    onerror="
                        console.error(
                            'Не удалось загрузить арт:',
                            '${image.replace(
                                /'/g,
                                "\\'"
                            )}'
                        );
                    "
                >

            `;

        });


        container.innerHTML += `

            <div class="arts-book">

                <h2 class="arts-title">
                    ${item.title || 'Без названия'}
                </h2>

                <div class="arts-gallery">

                    ${gallery}

                </div>

            </div>

        `;

    });

}
